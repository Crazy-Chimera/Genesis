name: GENESIS 2.27

on:
  workflow_dispatch:
  push:
    paths:
      - "genesis/rule_distribution.py"
      - "experiments/pw001_rule_distribution.py"
      - "tests/test_rule_distribution.py"
      - ".github/workflows/genesis-2.27.yml"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - run: pytest -q tests/test_rule_distribution.py
      - run: python -u experiments/pw001_rule_distribution.py | tee pw001-rule-distribution.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pw001-rule-distribution
          path: pw001-rule-distribution.txt
