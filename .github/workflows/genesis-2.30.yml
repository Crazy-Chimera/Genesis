name: GENESIS 2.30

on:
  workflow_dispatch:
  push:
    paths:
      - "genesis/rule_transition.py"
      - "genesis/rule_distribution.py"
      - "experiments/pw001_rule_transition_unseen.py"
      - ".github/workflows/genesis-2.30.yml"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - run: python experiments/pw001_rule_transition_unseen.py | tee genesis-2.30-results.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pw001-rule-transition-unseen
          path: genesis-2.30-results.txt
