name: PW-001 GENESIS-2.23 expanded cross-seed screening

on:
  workflow_dispatch:
  push:
    paths:
      - "genesis/cross_seed_generalization.py"
      - "experiments/pw001_cross_seed_expanded.py"
      - ".github/workflows/pw001-2.23.yml"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - run: |
          set -o pipefail
          python -u experiments/pw001_cross_seed_expanded.py | tee pw001-2.23.txt
      - run: grep -q '^SUMMARY$' pw001-2.23.txt
      - run: grep -q '^decision=' pw001-2.23.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pw001-genesis-2.23
          path: pw001-2.23.txt
