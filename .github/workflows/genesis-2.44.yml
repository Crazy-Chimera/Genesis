name: GENESIS 2.44

on:
  workflow_dispatch:
  push:
    paths:
      - "genesis/mechanistic_noise.py"
      - "experiments/pw001_mechanistic_noise.py"
      - "tests/test_mechanistic_noise.py"
      - ".github/workflows/genesis-2.44.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install '.[test]'
      - run: pytest -q tests/test_mechanistic_noise.py
      - run: python experiments/pw001_mechanistic_noise.py | tee genesis-2.44-results.txt
      - uses: actions/upload-artifact@v4
        with:
          name: genesis-2.44-results
          path: genesis-2.44-results.txt
