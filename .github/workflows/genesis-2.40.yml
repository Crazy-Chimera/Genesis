name: GENESIS-2.40 fine coupling validation

on:
  workflow_dispatch:
  push:
    paths:
      - "experiments/pw001_coupling_fine.py"
      - "genesis/core.py"
      - ".github/workflows/genesis-2.40.yml"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - run: python experiments/pw001_coupling_fine.py | tee genesis-2.40.txt
      - uses: actions/upload-artifact@v4
        with:
          name: genesis-2.40-fine-coupling
          path: genesis-2.40.txt
