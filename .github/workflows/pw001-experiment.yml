name: PW-001 experiment

on:
  workflow_dispatch:
  push:
    paths:
      - "genesis/core.py"
      - "genesis/observer.py"
      - "genesis/memory.py"
      - "genesis/evaluation.py"
      - "genesis/predictor.py"
      - "genesis/structural.py"
      - "genesis/innovation.py"
      - "genesis/state_innovation.py"
      - "genesis/state_trajectory.py"
      - "genesis/state_delta_trajectory.py"
      - "genesis/nonlinear_state.py"
      - "genesis/compressed_state_trajectory.py"
      - "genesis/nonlinear_state_trajectory.py"
      - "experiments/pw001_predictive_eval.py"
      - "experiments/pw001_robustness.py"
      - "experiments/pw001_structural_eval.py"
      - "experiments/pw001_state_trajectory.py"
      - "experiments/pw001_state_delta.py"
      - "experiments/pw001_representation_transfer.py"
      - "genesis/representation_transfer.py"
      - "experiments/pw001_state_trajectory_ridge.py"
      - "experiments/pw001_state_delta_trajectory.py"
      - "experiments/pw001_nonlinear_state.py"
      - "experiments/pw001_compressed_state_trajectory.py"
      - "experiments/pw001_nonlinear_state_trajectory.py"
      - "experiments/pw001_pca_innovation.py"
      - "genesis/state_trajectory_compressed.py"
      - "experiments/pw001_state_trajectory_compressed.py"
      - ".github/workflows/pw001-experiment.yml"

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - run: python experiments/pw001_predictive_eval.py | tee pw001-results.txt
      - run: python experiments/pw001_robustness.py | tee pw001-robustness.txt
      - run: python experiments/pw001_structural_eval.py | tee pw001-structural.txt
      - run: python experiments/pw001_state_trajectory.py | tee pw001-state-trajectory.txt
      - run: python experiments/pw001_state_delta.py | tee pw001-state-delta.txt
      - run: python experiments/pw001_representation_transfer.py | tee pw001-representation-transfer.txt
      - run: python experiments/pw001_state_trajectory_ridge.py | tee pw001-state-trajectory-ridge.txt
      - run: python experiments/pw001_state_delta_trajectory.py | tee pw001-state-delta-trajectory.txt
      - run: python experiments/pw001_nonlinear_state.py | tee pw001-nonlinear-state.txt
      - run: python experiments/pw001_compressed_state_trajectory.py | tee pw001-compressed-state-trajectory.txt
      - run: python experiments/pw001_nonlinear_state_trajectory.py | tee pw001-nonlinear-state-trajectory.txt
      - run: python experiments/pw001_pca_innovation.py | tee pw001-pca-innovation.txt
      - run: python experiments/pw001_state_trajectory_compressed.py | tee pw001-state-trajectory-compressed.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pw001-predictive-results
          path: |
            pw001-results.txt
            pw001-robustness.txt
            pw001-structural.txt
            pw001-state-trajectory.txt
            pw001-state-delta.txt
            pw001-representation-transfer.txt
            pw001-state-trajectory-ridge.txt
            pw001-state-delta-trajectory.txt
            pw001-nonlinear-state.txt
            pw001-compressed-state-trajectory.txt
            pw001-nonlinear-state-trajectory.txt
            pw001-pca-innovation.txt
            pw001-state-trajectory-compressed.txt
