name: PW-001 experiment

on:
  workflow_dispatch:
  push:
    paths:
      - "genesis/**"
      - "experiments/pw001_predictive_eval.py"
      - "experiments/pw001_state_trajectory.py"
      - "experiments/pw001_regularized_trajectory.py"
      - ".github/workflows/pw001-experiment.yml"

jobs:
  predictive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - run: python -u experiments/pw001_predictive_eval.py | tee pw001-results.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pw001-predictive
          path: pw001-results.txt

  state-trajectory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - run: python -u experiments/pw001_state_trajectory.py | tee pw001-state-trajectory.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pw001-state-trajectory
          path: pw001-state-trajectory.txt

  regularized-state-trajectory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - run: python -u experiments/pw001_regularized_trajectory.py | tee pw001-regularized-trajectory.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pw001-regularized-trajectory
          path: pw001-regularized-trajectory.txt
