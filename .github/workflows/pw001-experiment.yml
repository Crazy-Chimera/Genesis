name: PW-001 experiment

on:
  workflow_dispatch:
  push:
    paths:
      - "genesis/**"
      - "experiments/pw001_predictive_eval.py"
      - "experiments/pw001_compressed_trajectory.py"
      - "genesis/compressed_trajectory.py"
      - "experiments/pw001_state_trajectory.py"
      - "experiments/pw001_state_motion.py"
      - "experiments/pw001_state_change_trajectory.py"
      - "experiments/pw001_state_trajectory_ridge.py"
      - "experiments/pw001_delta_state_trajectory.py"
      - "experiments/pw001_state_feature_trajectory.py"
      - "experiments/pw001_state_trajectory_regularization.py"
      - "experiments/pw001_state_trajectory_isolated.py"
      - "experiments/pw001_state_velocity.py"
      - "experiments/pw001_state_trajectory_sweep.py"
      - "experiments/pw001_state_trajectory_geometry.py"
      - "genesis/state_trajectory_geometry.py"
      - "experiments/pw001_regularized_trajectory.py"
      - "experiments/pw001_rule_update.py"
      - "genesis/rule_update.py"
      - "experiments/pw001_rule_invariant.py"
      - "genesis/rule_invariant.py"
      - "experiments/pw001_nonlinear_state_trajectory.py"
      - "experiments/pw001_direct_state_transfer.py"
      - "experiments/pw001_global_phase.py"
      - "experiments/pw001_mechanistic.py"
      - "genesis/mechanistic.py"
      - "genesis/mechanistic_decomposition.py"
      - "experiments/pw001_mechanistic_decomposition.py"
      - "experiments/pw001_mechanistic_validation.py"
      - "experiments/pw001_mechanistic_coupling.py"
      - "experiments/pw001_mechanistic_noise.py"
      - "experiments/pw001_mechanistic_horizon.py"
      - "genesis/mechanistic_horizon.py"
      - "genesis/mechanistic_noise.py"
      - "experiments/pw001_state_direction.py"
      - "experiments/pw001_temporal_state.py"
      - "genesis/temporal_state.py"
      - "genesis/precision_audit.py"
      - "experiments/pw001_precision_audit.py"
      - "experiments/pw001_state_change.py"
      - "genesis/state_change.py"
      - "tests/test_state_change.py"
      - "experiments/pw001_numerical_convergence.py"
      - "genesis/numerical_convergence.py"
      - "tests/test_numerical_convergence.py"
      - ".github/workflows/pw001-experiment.yml"

jobs:
  numerical-convergence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install .
      - run: set -o pipefail; python -u experiments/pw001_numerical_convergence.py | tee pw001-numerical-convergence.txt
      - uses: actions/upload-artifact@v4
        with: {name: pw001-numerical-convergence, path: pw001-numerical-convergence.txt}

  predictive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install .
      - run: set -o pipefail; python -u experiments/pw001_predictive_eval.py | tee pw001-results.txt
      - uses: actions/upload-artifact@v4
        with: {name: pw001-predictive, path: pw001-results.txt}

  state-trajectory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
