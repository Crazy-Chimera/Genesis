name: GENESIS 2.13 experiment

on:
  workflow_dispatch:
  push:
    paths:
      - "genesis/state_trajectory.py"
      - "genesis/state_difference.py"
      - "experiments/pw001_state_difference.py"
      - "tests/test_state_trajectory.py"
      - ".github/workflows/genesis-2.13.yml"

jobs:
  experiment:
    strategy:
      fail-fast: false
      matrix:
        seed: [390001, 390002, 390003]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install . pytest
      - run: pytest -q tests/test_state_trajectory.py
      - run: |
          set -o pipefail
          python experiments/pw001_state_difference.py --seed ${{ matrix.seed }} | tee genesis-2.13-${{ matrix.seed }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: genesis-2.13-results-${{ matrix.seed }}
          path: genesis-2.13-${{ matrix.seed }}.txt
