name: PW-001 GENESIS-2.24 rule-native screening

on:
  workflow_dispatch:
  push:
    paths:
      - "genesis/rule_native.py"
      - "experiments/pw001_rule_native.py"
      - "tests/test_rule_native.py"
      - ".github/workflows/pw001-2.24.yml"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - run: set -o pipefail; python -u experiments/pw001_rule_native.py | tee pw001-2.24.txt
      - run: grep -q '^SUMMARY$' pw001-2.24.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pw001-genesis-2.24
          path: pw001-2.24.txt
