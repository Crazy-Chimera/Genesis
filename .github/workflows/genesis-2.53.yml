name: GENESIS-2.53 coupling offset bootstrap

on:
  workflow_dispatch:
  push:
    paths:
      - "experiments/pw001_coupling_offset_bootstrap.py"
      - "experiments/pw001_coupling_noise_ablation.py"
      - "genesis/core.py"
      - ".github/workflows/genesis-2.53.yml"

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - run: python -u experiments/pw001_coupling_offset_bootstrap.py | tee pw001-2.53.txt
      - run: test "$(grep -Ec '^(0|0\.00025|0\.0005|0\.001|0\.002) ' pw001-2.53.txt)" -eq 15
      - uses: actions/upload-artifact@v4
        with:
          name: genesis-2.53-coupling-offset-bootstrap
          path: pw001-2.53.txt
