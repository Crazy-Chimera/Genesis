name: GENESIS-2.55 grid-resolution scaling control

on:
  workflow_dispatch:
  push:
    paths:
      - "experiments/pw001_coupling_grid_scaling.py"
      - ".github/workflows/genesis-2.55.yml"

jobs:
  grid-scaling:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - run: set -o pipefail; python -u experiments/pw001_coupling_grid_scaling.py | tee pw001-2.55-grid-scaling.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pw001-2.55-grid-scaling
          path: pw001-2.55-grid-scaling.txt
