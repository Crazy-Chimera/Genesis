name: PW-001 GENESIS-2.13

on:
  workflow_dispatch:
  push:
    paths:
      - "genesis/state_trajectory.py"
      - "experiments/pw001_state_difference_trajectory.py"
      - ".github/workflows/pw001-2.13.yml"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - run: python experiments/pw001_state_difference_trajectory.py | tee pw001-2.13.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pw001-genesis-2.13
          path: pw001-2.13.txt
