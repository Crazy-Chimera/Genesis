name: GENESIS-2.41 independent mechanistic audit

on:
  workflow_dispatch:
  push:
    paths:
      - "experiments/pw001_independent_mechanistic_audit.py"
      - "genesis/core.py"
      - ".github/workflows/genesis-2.41.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - run: python experiments/pw001_independent_mechanistic_audit.py | tee genesis-2.41-audit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: genesis-2.41-independent-audit
          path: genesis-2.41-audit.txt
