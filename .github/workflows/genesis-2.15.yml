name: GENESIS 2.15 representation bottleneck

on:
  workflow_dispatch:
  push:
    paths:
      - "genesis/compressed_state_trajectory.py"
      - "experiments/pw001_representation_bottleneck.py"
      - ".github/workflows/genesis-2.15.yml"

jobs:
  screening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - run: python experiments/pw001_representation_bottleneck.py | tee genesis-2.15-results.txt
      - uses: actions/upload-artifact@v4
        with:
          name: genesis-2.15-representation-bottleneck
          path: genesis-2.15-results.txt
