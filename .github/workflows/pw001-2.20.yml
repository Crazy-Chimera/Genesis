name: PW-001 GENESIS-2.20 representation transfer

on:
  workflow_dispatch:
  push:
    paths:
      - "genesis/representation_transfer.py"
      - "experiments/pw001_representation_transfer.py"
      - "tests/test_representation_transfer.py"
      - ".github/workflows/pw001-2.20.yml"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install . pytest
      - run: pytest -q tests/test_representation_transfer.py
      - run: |
          set -o pipefail
          python -u experiments/pw001_representation_transfer.py | tee pw001-2.20.txt
      - run: grep -q '^SUMMARY$' pw001-2.20.txt
      - run: grep -q '^decision=' pw001-2.20.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pw001-genesis-2.20
          path: pw001-2.20.txt
