name: PW-001 GENESIS-2.22 seed-invariant generalization

on:
  workflow_dispatch:
  push:
    paths:
      - "genesis/seed_invariant.py"
      - "experiments/pw001_seed_invariant.py"
      - "tests/test_seed_invariant.py"
      - ".github/workflows/pw001-2.22.yml"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install . pytest
      - run: pytest -q tests/test_seed_invariant.py
      - run: |
          set -o pipefail
          python -u experiments/pw001_seed_invariant.py | tee pw001-2.22.txt
      - run: grep -q '^SUMMARY$' pw001-2.22.txt
      - run: grep -q '^decision=' pw001-2.22.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pw001-genesis-2.22
          path: pw001-2.22.txt
