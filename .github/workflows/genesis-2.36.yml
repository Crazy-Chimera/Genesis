name: GENESIS-2.36 mechanistic benchmark

on:
  workflow_dispatch:
  push:
    paths:
      - "genesis/mechanistic.py"
      - "experiments/pw001_mechanistic.py"
      - ".github/workflows/genesis-2.36.yml"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - run: python experiments/pw001_mechanistic.py | tee genesis-2.36-results.txt
      - uses: actions/upload-artifact@v4
        with:
          name: genesis-2.36-mechanistic
          path: genesis-2.36-results.txt
