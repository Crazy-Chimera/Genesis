name: PW-001 GENESIS-2.21 cross-seed generalization

on:
  workflow_dispatch:
  push:
    paths:
      - "genesis/cross_seed_generalization.py"
      - "experiments/pw001_cross_seed_generalization.py"
      - "tests/test_cross_seed_generalization.py"
      - ".github/workflows/pw001-2.21.yml"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install . pytest
      - run: pytest -q tests/test_cross_seed_generalization.py
      - run: |
          set -o pipefail
          python -u experiments/pw001_cross_seed_generalization.py | tee pw001-2.21.txt
      - run: grep -q '^SUMMARY$' pw001-2.21.txt
      - run: grep -q '^decision=' pw001-2.21.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pw001-genesis-2.21
          path: pw001-2.21.txt

# Dedicated GENESIS-2.21 workflow; isolated from the long aggregate PW-001 suite.
