name: GENESIS-2.56 replicated grid-convergence control

on:
  workflow_dispatch:
  push:
    paths:
      - "experiments/pw001_coupling_grid_scaling_replication.py"
      - ".github/workflows/genesis-2.56.yml"

jobs:
  replicated-grid-convergence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - run: set -o pipefail; python -u experiments/pw001_coupling_grid_scaling_replication.py | tee pw001-2.56-grid-convergence.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pw001-2.56-grid-convergence
          path: pw001-2.56-grid-convergence.txt
