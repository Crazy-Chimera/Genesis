name: GENESIS 2.45 experiment

on:
  workflow_dispatch:
  push:
    paths:
      - "experiments/pw001_coupling_perturbation.py"
      - "genesis/core.py"
      - ".github/workflows/genesis-2.45.yml"

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - run: python experiments/pw001_coupling_perturbation.py | tee genesis-2.45-results.txt
      - uses: actions/upload-artifact@v4
        with:
          name: genesis-2.45-results
          path: genesis-2.45-results.txt
